<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <title>Mi Dashboard | Historia Interactiva</title>
    <link rel="stylesheet" href="/assets/css/global.css" />
    <link rel="stylesheet" href="/assets/css/dashboard.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/cartas.css" />
    <link rel="stylesheet" href="/assets/css/articulos.css" />
    <link rel="stylesheet" href="/output.css" />
    <script src="/js/ui/tema.js"></script>
  </head>
  <body>
    <div class="nav-interno">
      <a class="contenedor-logo" href="/">
        <span
          ><img class="logo" src="/svg/logo.svg" /><img
            class="logo-dark"
            src="/svg/logo-dark.svg"
        /></span>
      </a>
      <ul>
        <li>
          <button data-vista="estadisticas">
            <img src="/assets/icons/home.svg" />Inicio
          </button>
        </li>
        <li><button data-vista="cartas">Cartas</button></li>
        <li><button data-vista="paises">Países</button></li>
        <li><button data-vista="perfil">Perfil</button></li>
      </ul>
      <div id="navUserSection"></div>
      <button
        data-tema-boton
        type="button"
        aria-label="Activar modo oscuro"
        class="btn-tema"
      >
        <svg
          class="icono-sol"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-4.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm8 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM4 11.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm16.5-5.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM3.5 6a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm13 13.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM7.5 3a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM6 19.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"
          />
        </svg>
        <svg
          class="icono-luna"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <path d="M12 21a9 9 0 0 0 8.7-11.1A7.5 7.5 0 1 1 14.1 3.3 9 9 0 0 0 12 21z" />
        </svg>
      </button>
    </div>
    <main>
      <section id="contenedor-principal"></section>
      <div id="overlay-carta-expandida" class="overlay-carta oculto">
        <div id="carta-expandida-contenedor"></div>
      </div>
    </main>

    <script src="/js/services/authService.js"></script>
    <script src="/js/services/dashboardService.js"></script>
    <script src="/js/ui/nav.js"></script>
    <script src="/js/ui/layout.js"></script>

    <script src="/js/ui/dashboard/estadisticas.js"></script>
    <script src="/js/ui/dashboard/coleccion.js"></script>
    <script src="/js/ui/dashboard/paises.js"></script>
    <script src="/js/ui/paises/capsulaPais.js"></script>
    <script src="/js/ui/dashboard/perfil.js"></script>
    <script src="/js/ui/dashboard/router.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.32.1/dist/globe.gl.min.js"></script>
    <script src="/js/3D/crearGlobo.js"></script>

    <script type="text/javascript" src="/vanilla-tilt.min.js"></script>
    <script src="https://unpkg.com/popper.js@1"></script>
    <script src="https://unpkg.com/tippy.js@5"></script>
  </body>
</html>
