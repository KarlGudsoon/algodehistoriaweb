<div class="px-2 py-2 md:px-8 md:py-4 flex-1 flex flex-col gap-4">
  <div class="px-2">
    <h1 class="titulo-vista">Mi Colección de Cartas</h1>
    <p class="m-0">Administra tu colección de cartas y sigue tu progreso.</p>
  </div>
  <div class="contenedor-infocards gap-3 md:gap-4 " id="resumenProgresoCartas">
    <div class="infocards !flex-auto items-center skeleton">
      <img class="icon" src="/assets/icons/cards.svg" alt="" />
      <div class="contenido">
        <h3>Cartas coleccionadas</h3>
        <div class="infocards-progreso">
          <span id="cartasObtenidas" class="bold"></span>/<span
            id="cartasTotales"
          ></span>
        </div>
      </div>
    </div>
    <div class="flex flex-auto gap-3 md:gap-4 flex-row">
      <div class="infocards infocard-oro items-center skeleton">
        <div class="icon !bg-yellow-500 hidden md:block md:!size-4"></div>
        <div class="contenido">
          <h3 class="text-sm md:text-base">Oro</h3>
          <div class="infocards-progreso">
            <span id="cartasOro" class="bold">
          </div>
        </div>
      </div>
      <div class="infocards infocard-plata items-center skeleton">
        <div class="icon !bg-gray-400 hidden md:block md:!size-4"></div>
        <div class="contenido">
          <h3 class="text-sm md:text-base">Plata</h3>
          <div class="infocards-progreso">
            <span id="cartasPlata" class="bold">
          </div>
        </div>
      </div>
      <div class="infocards infocard-bronce items-center skeleton">
        <div class="icon !bg-amber-700 hidden md:block md:!size-4"></div>
        <div class="contenido">
          <h3 class="text-sm md:text-base">Bronce</h3>
          <div class="infocards-progreso">
            <span id="cartasBronce" class="bold">
          </div>
        </div>
      </div>
    </div>
  </div>
  <div
    class="vista-coleccion flex flex-col flex-1 bg-[--tertiary-color] shadow-lg rounded-2xl p-4 md:p-6 border border-solid border-black border-opacity-10"
  >
    <div class="controles-coleccion">
      <div class="buscador">
        <input
          type="text"
          id="buscadorCartas"
          class="buscador"
          placeholder="Buscar personaje..."
          autocomplete="off"
        />
      </div>
      <div class="filtros-cartas">
        <div class="select-campo">
          <span
            class="select-icono select-icono-periodo"
            aria-hidden="true"
          ></span>
          <select class="select-1" id="filtroPeriodo">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="select-campo">
          <span
            class="select-icono select-icono-rareza"
            aria-hidden="true"
          ></span>
          <select class="select-1" id="filtroRareza">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="select-campo">
          <span
            class="select-icono select-icono-orden"
            aria-hidden="true"
          ></span>
          <select class="select-1" id="filtroOrden">
            <option value="periodo">Por periodo</option>
            <option value="recientes">Más recientes</option>
            <option value="nacimiento">Año de nacimiento</option>
            <option value="nombre">Nombre A-Z</option>
          </select>
        </div>
        <button
          type="button"
          id="toggleSoloObtenidas"
          class="toggle-solo-obtenidas"
        >
          Solo obtenidas
        </button>
      </div>
    </div>

    <div class="flex-1 content-start" id="coleccionCartas">
      <div class="flex flex-1 flex-col items-center justify-center">
        <svg
          class="animate-spin"
          xmlns="http://www.w3.org/2000/svg"
          width="3rem"
          height="3rem"
          viewBox="0 0 24 24"
        >
          <path d="M0 0h24v24H0z" fill="none" />
          <circle
            cx="12"
            cy="12"
            r="9"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            opacity=".1"
          />
          <path
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="3"
            d="M12 3a8.96 8.96 0 0 0-6.225 2.5"
          />
        </svg>
        <p>Cargando cartas</p>
      </div>
    </div>
    <div id="coleccionPaises"></div>
  </div>
</div>
