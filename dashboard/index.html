<!doctype html>
<html lang="es">
  <head>

    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <title>Mi Dashboard | Historia Interactiva</title>
    <link rel="stylesheet" href="/assets/css/global.css" />
    <link rel="stylesheet" href="/assets/css/dashboard.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />

            class="logo-dark"
            src="/svg/logo-dark.svg"
        /></span>
      </a>
      <ul>
        <li>
          <button data-vista="estadisticas">
            <img src="/assets/icons/home.svg" />Inicio
          </button>
        </li>
        <li><button data-vista="cartas">Cartas</button></li>
        <li><button data-vista="paises">Países</button></li>
        <li><button data-vista="perfil">Perfil</button></li>
      </ul>
      <div class="flex items-center gap-4 md:flex-col">

          data-tema-boton
          type="button"
          aria-label="Activar modo oscuro"
          class="btn-tema"
        >

            class="icono-sol"

            height="1em"
            viewBox="0 0 24 24"
          >
            <path d="M0 0h24v24H0z" fill="none" />
            <g fill="none">
              <g fill="currentColor" clip-path="url(#SVGHcSWxdhd)">

                  d="M12 20a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1m-7.071-2.343a1 1 0 1 1 1.414 1.414l-1.414 1.414a1 1 0 0 1-1.414-1.414zm12.728 0a1 1 0 0 1 1.414 0l1.414 1.414a1 1 0 0 1-1.414 1.414l-1.414-1.414a1 1 0 0 1 0-1.414M12 6a6 6 0 1 1 0 12a6 6 0 0 1 0-12m-9 5a1 1 0 1 1 0 2H1a1 1 0 1 1 0-2zm20 0a1 1 0 1 1 0 2h-2a1 1 0 1 1 0-2zM3.515 3.515a1 1 0 0 1 1.414 0l1.414 1.414a1 1 0 1 1-1.414 1.414L3.515 4.929a1 1 0 0 1 0-1.414m15.556 0a1 1 0 0 1 1.414 1.414l-1.414 1.414a1 1 0 1 1-1.414-1.414zM12 0a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V1a1 1 0 0 1 1-1"
                />
              </g>
              <defs>
                <clipPath id="SVGHcSWxdhd">
                  <path fill="#fff" d="M0 0h24v24H0z" />
                </clipPath>
              </defs>
            </g>
          </svg>

          <svg
            class="icono-luna"
            xmlns="http://www.w3.org/2000/svg"
            width="1em"
            height="1em"
            viewBox="0 0 24 24"
          >
            <path d="M0 0h24v24H0z" fill="none" />
            <path
              fill="currentColor"
              d="M9.272 2.406a1 1 0 0 0-1.23-1.355C6.59 1.535 5.432 2.488 4.37 3.55a11.4 11.4 0 0 0 0 16.182c4.518 4.519 11.51 4.261 15.976-.205c1.062-1.062 2.014-2.22 2.498-3.673A1 1 0 0 0 21.55 14.6c-3.59 1.322-7.675.734-10.433-2.025C8.35 9.808 7.788 5.744 9.272 2.406"

        </button>
        <div id="navUserSection"></div>
      </div>
    </div>
    <main>
      <section id="contenedor-principal"></section>
      <div id="overlay-carta-expandida" class="overlay-carta oculto">
        <div id="carta-expandida-contenedor"></div>
      </div>
    </main>
    <div class="nav nav-mobile md:hidden flex justify-center w-full">
      <ul>
        <li>
          <button data-vista="estadisticas">
            <img src="/assets/icons/home.svg" />Inicio
          </button>
        </li>
        <li>
          <button data-vista="cartas">
            <img src="/assets/icons/cards.svg" />Cartas

        <li>

            <img src="/assets/icons/world.svg" />Países

        </li>
        <li>
          <button data-vista="perfil">
            <img src="/assets/icons/master.svg" />Perfil

        </li>

    <script src="https://unpkg.com/popper.js@1"></script>
    <script src="https://unpkg.com/tippy.js@5"></script>
    <script type="text/javascript" src="/vanilla-tilt.min.js"></script>

    <script src="/js/ui/dashboard/estadisticas.js"></script>

    <script src="/js/ui/dashboard/paises.js"></script>
    <script src="/js/ui/paises/capsulaPais.js"></script>
