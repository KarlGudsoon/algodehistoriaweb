services:
  web:
    image: php:8.3-apache
    container_name: historia_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    # Instala la extensión de MySQL para PHP y habilita mod_rewrite al iniciar
    command: >
      bash -c "a2enmod rewrite
      && docker-php-ext-install mysqli pdo pdo_mysql
      && apache2-foreground"

  db:
    image: mysql:8.0
    container_name: algodehistoria
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: algodehistoria
      MYSQL_USER: historia_user
      MYSQL_PASSWORD: historia_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: historia_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root123
    depends_on:
      - db

volumes:
  db_data:
