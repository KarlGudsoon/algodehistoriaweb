<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="/index.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/output.css" />
    <script src="/js/services/authService.js"></script>
    <script src="/js/components.js"></script>
  </head>
  <body style="background-color: #111927">
    <site-header></site-header>
    <site-mobile-nav></site-mobile-nav>
    <main>
      <h1>🏛️ ADIVINA EL PERSONAJE HISTÓRICO 🕵️</h1>
      <p>Adivina el personaje en base a las pistas que te dan</p>
      <div id="game-container">
        <div id="result"></div>
        <div class="character-revealed">
          <p id="character-revealed">Personaje Histórico</p>
          <button id="character-skip">
            <img src="/assets/icons/reload.svg" />
          </button>
        </div>
        <div id="clue-container">
          <div class="historical-character">
            <img id="clue-image" src="" alt="Clue Image" />
            <p id="clue-text"></p>
          </div>
          <div id="clue-revealed">
            <span class="revealed" data-clue="1">?</span>
            <span class="revealed" data-clue="2">?</span>
            <span class="revealed" data-clue="3">?</span>
            <span class="revealed" data-clue="4">?</span>
            <span class="revealed" data-clue="5">?</span>
          </div>
        </div>
        <div class="container-buttons">
          <input type="text" id="guess" placeholder="Tu respuesta" />
          <button id="submit-guess">Enviar</button>
          <button id="clue-skip">Skip</button>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
