<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | Historia Interactiva</title>
    <link rel="icon" href="/assets/icons/logo.svg" />
    <link rel="stylesheet" href="/assets/css/global.css" />
    <link rel="stylesheet" href="/assets/css/auth.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/output.css" />
    <script src="/js/ui/tema.js"></script>
    <script src="/js/services/authService.js"></script>
    <script src="/js/components.js"></script>
  </head>
  <body class="bg-secondary min-h-screen flex flex-col m-0 font-[roboto]">
    <!-- <site-header></site-header>
    <site-mobile-nav></site-mobile-nav> -->
    <main
      class="bg-[var(--primary-color)] flex flex-wrap rounded-2xl gap-8 shadow-md flex-1 "
    >
      <div class="flex-1 flex flex-col flex-wrap justify-center items-center">
        
        <div class="h-16">
          <img class="h-full " src="/assets/icons/logo.svg">
        </div>
        <h1 class="text-2xl font-bold mb-1 text-white">Bienvenido a Algo de Historia</h1>
        <p class="text-sm text-white mb-6">
          Continúa tu recorrido por la historia
        </p>
        <div class="bg-black/10 p-1 rounded-2xl flex gap-2 mb-4">
          <button class="btn-auth active" data-view="login">Iniciar Sesión</button>
          <button class="btn-auth" data-view="register">Registrarse</button>
        </div>
        <div
          id="errorMessage"
          class=" bg-black/10 text-white text-sm p-3 rounded mb-4 border border-solid border-white/25 hidden"
        >dsadasdasdad</div>
        <form id="loginForm" class="rounded-lg w-full max-w-sm flex flex-col">
          
          <label for="email" class="block mb-1 text-sm font-medium text-white"
            >Correo electrónico</label
          >
          <input
            type="email"
            id="emailLogin"
            name="email"
            class="bg-black/10 shadow-inner border font-[roboto] text-white border-solid border-white/25 rounded-lg p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-white"
            required
            autocomplete="email"
          />

          <label
            for="password"
            class="block mb-1 text-sm font-medium text-white"
            >Contraseña</label
          >
          <input
            type="password"
            id="passwordLogin"
            name="password"
            class="bg-black/10 shadow-inner border font-[roboto] text-white border-solid border-white/25 rounded-lg p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-white"
            required
            minlength="8"
            autocomplete="current-password"
          />

          <button
            type="submit"
            id="loginBtn"
            class="btn-auth-submit"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden animate-spin" width="1em" height="1em" viewBox="0 0 24 24">
              <path d="M0 0h24v24H0z" fill="none" />
              <path fill="var(--primary-color)" d="M12 2A10 10 0 1 0 22 12A10 10 0 0 0 12 2Zm0 18a8 8 0 1 1 8-8A8 8 0 0 1 12 20Z" opacity=".5" />
              <path fill="var(--primary-color)" d="M20 12h2A10 10 0 0 0 12 2V4A8 8 0 0 1 20 12Z">
              </path>
            </svg>
            <span>Ingresar</span>
          </button>
          
        </form>
        <form
          id="registerForm"
          class="rounded-lg w-full max-w-sm flex flex-col hidden"
        >
          <label class="block mb-2 text-sm font-medium text-white">Nombre</label>
          <input
            type="text"
            id="nameRegister"
            class="bg-black/10 shadow-inner border font-[roboto] text-white border-solid border-white/25 rounded-lg p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-white"
            required
          />

          <label class="block mb-2 text-sm font-medium text-white">Correo electrónico</label>
          <input
            type="email"
            id="emailRegister"
            class="bg-black/10 shadow-inner border font-[roboto] text-white border-solid border-white/25 rounded-lg p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-white"
            required
          />

          <label class="block mb-2 text-sm font-medium text-white">Contraseña</label>
          <input
            type="password"
            id="passwordRegister"
            class="bg-black/10 shadow-inner border font-[roboto] text-white border-solid border-white/25 rounded-lg p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-white"
            required
            minlength="8"
          />

          <button
            type="submit"
            id="btn-register"
            class="btn-auth-submit"
          >
           <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden animate-spin" width="1em" height="1em" viewBox="0 0 24 24">
              <path d="M0 0h24v24H0z" fill="none" />
              <path fill="var(--primary-color)" d="M12 2A10 10 0 1 0 22 12A10 10 0 0 0 12 2Zm0 18a8 8 0 1 1 8-8A8 8 0 0 1 12 20Z" opacity=".5" />
              <path fill="var(--primary-color)" d="M20 12h2A10 10 0 0 0 12 2V4A8 8 0 0 1 20 12Z">
              </path>
            </svg>
            <span>Registrarse</span>
          </button>
        </form>
        <button
          data-tema-boton
          type="button"
          aria-label="Activar modo oscuro"
          class="btn-tema my-4"
        >
          <svg
            class="icono-sol"
            xmlns="http://www.w3.org/2000/svg"
            width="1em"
            height="1em"
            viewBox="0 0 24 24"
          >
            <path d="M0 0h24v24H0z" fill="none" />
            <g fill="none">
              <g fill="currentColor" clip-path="url(#SVGHcSWxdhd)">
                <path
                  d="M12 20a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1m-7.071-2.343a1 1 0 1 1 1.414 1.414l-1.414 1.414a1 1 0 0 1-1.414-1.414zm12.728 0a1 1 0 0 1 1.414 0l1.414 1.414a1 1 0 0 1-1.414 1.414l-1.414-1.414a1 1 0 0 1 0-1.414M12 6a6 6 0 1 1 0 12a6 6 0 0 1 0-12m-9 5a1 1 0 1 1 0 2H1a1 1 0 1 1 0-2zm20 0a1 1 0 1 1 0 2h-2a1 1 0 1 1 0-2zM3.515 3.515a1 1 0 0 1 1.414 0l1.414 1.414a1 1 0 1 1-1.414 1.414L3.515 4.929a1 1 0 0 1 0-1.414m15.556 0a1 1 0 0 1 1.414 1.414l-1.414 1.414a1 1 0 1 1-1.414-1.414zM12 0a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V1a1 1 0 0 1 1-1"
                />
              </g>
              <defs>
                <clipPath id="SVGHcSWxdhd">
                  <path fill="#fff" d="M0 0h24v24H0z" />
                </clipPath>
              </defs>
            </g>
          </svg>

          <svg
            class="icono-luna"
            xmlns="http://www.w3.org/2000/svg"
            width="1em"
            height="1em"
            viewBox="0 0 24 24"
          >
            <path d="M0 0h24v24H0z" fill="none" />
            <path
              fill="currentColor"
              d="M9.272 2.406a1 1 0 0 0-1.23-1.355C6.59 1.535 5.432 2.488 4.37 3.55a11.4 11.4 0 0 0 0 16.182c4.518 4.519 11.51 4.261 15.976-.205c1.062-1.062 2.014-2.22 2.498-3.673A1 1 0 0 0 21.55 14.6c-3.59 1.322-7.675.734-10.433-2.025C8.35 9.808 7.788 5.744 9.272 2.406"
            />
          </svg>
        </button>
      </div>
      <div class="flex-1 bg-[#fefefe] rounded-2xl">
        <div class="contenedor-logo" id="portada">
          <span
            ><img class="logo" src="/svg/logo-dark.svg" /><img
              class="logo-dark"
              src="/svg/logo-dark.svg"
          /></span>
        </div>
        <p class="max-w-lg w-full m-auto text-center">

          Bienvenido a <span class="text-primary">Algo de Historia</span>,
          ingresa a tu cuenta para visualizar sus estadisticas en el estudio de los
          artículos interactivos. 
        </p>
        </p>
      </div>
    </main>

    <script src="/js/ui/auth/login.js"></script>
    <script src="/js/ui/auth/register.js"></script>


    <script>
      
    </script>
  </body>
</html>
