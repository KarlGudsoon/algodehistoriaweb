<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión | Historia Interactiva</title>
    <link rel="icon" href="/assets/icons/logo.svg" />
    <link rel="stylesheet" href="/assets/css/global.css" />
    <link rel="stylesheet" href="/assets/css/auth.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/output.css" />
    <script src="/js/ui/tema.js"></script>
    <script src="/js/services/authService.js"></script>
    <script src="/js/components.js"></script>
  </head>
  <body class="bg-secondary min-h-screen flex flex-col m-0 font-[roboto]">
    <site-header></site-header>
    <site-mobile-nav></site-mobile-nav>

    <main class="flex-1 flex items-center justify-center px-4 py-12">
      <form
        id="loginForm"
        class="bg-primary p-8 rounded-lg shadow-md w-full max-w-sm flex flex-col"
      >
        <h1 class="text-2xl font-bold mb-1 text-white">Iniciar sesión</h1>
        <p class="text-sm text-white mb-6">
          Continúa tu recorrido por la historia
        </p>

        <div
          id="errorMessage"
          class="hidden bg-red-100 text-red-700 text-sm p-3 rounded mb-4"
        ></div>

        <label for="email" class="block mb-1 text-sm font-medium text-white"
          >Correo electrónico</label
        >
        <input
          type="email"
          id="email"
          name="email"
          class="bg-black/10 shadow-inner border font-[roboto] text-white border-solid border-white/25 rounded-lg p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-white"
          required
          autocomplete="email"
        />

        <label for="password" class="block mb-1 text-sm font-medium text-white"
          >Contraseña</label
        >
        <input
          type="password"
          id="password"
          name="password"
          class="bg-black/10 shadow-inner border font-[roboto] text-white border-solid border-white/25 rounded-lg p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-white"
          required
          minlength="8"
          autocomplete="current-password"
        />

        <button
          type="submit"
          id="loginBtn"
          class="w-full bg-blue-600 text-white py-2 rounded font-medium hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Ingresar
        </button>

        <p class="text-sm text-center mt-4 text-white">
          ¿No tienes cuenta?
          <a href="/auth/registro.html" class="hover:underline">Regístrate</a>
        </p>
      </form>
    </main>

    <site-footer></site-footer>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const errorBox = document.getElementById("errorMessage");
          const btn = document.getElementById("loginBtn");

          errorBox.classList.add("hidden");
          btn.disabled = true;
          btn.textContent = "Ingresando...";

          try {
            await login(email, password);
            window.location.href = "/dashboard/";
          } catch (error) {
            errorBox.textContent = error.message;
            errorBox.classList.remove("hidden");
            btn.disabled = false;
            btn.textContent = "Ingresar";
          }
        });
    </script>
  </body>
</html>
